services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nfl_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: NewStrongPassword!123
      MYSQL_DATABASE: nfl_ai
      MYSQL_USER: nfl_user
      MYSQL_PASSWORD: nfl_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./setup_mysql.sql:/docker-entrypoint-initdb.d/setup_mysql.sql
    networks:
      - nfl_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: .
    container_name: nfl_ai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://nfl_user:nfl_password@mysql:3306/nfl_ai
      - MYSQL_HOST=mysql
      - MYSQL_USER=nfl_user
      - MYSQL_PASSWORD=nfl_password
      - MYSQL_DATABASE=nfl_ai
      - PORT=8000
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - MODEL_PATH=/app/models
      - TENSORFLOW_MODEL_PATH=/app/models/qb_td_model.keras
      - TENSORFLOW_SCALER_PATH=/app/models/feature_scaler.pkl
      - TENSORFLOW_METRICS_PATH=/app/models/training_metrics.json
      - REDIS_URL=redis://redis:6379/0
      - TEST_MODE=0
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nfl_network
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:8000
    container_name: nfl_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nfl_network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: nfl_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nfl_network
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

networks:
  nfl_network:
    driver: bridge