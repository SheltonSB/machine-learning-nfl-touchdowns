name: Backend Tests

on:
  push:
    paths:
      - 'enhanced-nfl-platform/backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'enhanced-nfl-platform/backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r enhanced-nfl-platform/backend/requirements.txt

      - name: Run backend tests
        env:
          TEST_MODE: 'true'
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80 enhanced-nfl-platform/backend/tests
